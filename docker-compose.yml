services:
  car-price-app:
    build: .
    image: car-price-mlops:v1
    container_name: car-price-predictor
    ports:
      - "8501:8501"
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

  mlflow-ui:
    image: car-price-mlops:v1
    container_name: car-price-mlflow
    depends_on:
      - car-price-app
    entrypoint: ["mlflow", "ui", "--backend-store-uri", "file:///app/mlruns", "--host", "0.0.0.0", "--port", "5000"]
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/app/mlruns
    restart: unless-stopped